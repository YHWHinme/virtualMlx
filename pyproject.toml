[project]
name = "VirtualMlx"
version = "0.1.0"
description = "Local voice agent — Silero VAD, Moonshine STT, Kokoro TTS, Ollama LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "silero-vad>=5.1",
    "torch>=2.0",
    "moonshine-voice>=0.1,<0.2",
    "kokoro-onnx>=0.4",
    "onnxruntime>=1.17",
    "transformers>=4.38",
    "huggingface-hub>=0.20",
    "rich>=13.0",
    "langchain",
    "langchain-core",
    "langchain-ollama",
    "langchain-mcp-adapters",
    "langgraph",
]

[tool.ruff.lint]
extend-ignore = ["N999", "S110", "S112"]
